<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telão</title>
<meta name="description" content="Crie uma sala, compartilhe a tela e mande o link no Discord.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#ffe600;   /* fluorescent poster paper */
  --tinta:#1b1464;   /* ink blue, used instead of black */
  --rosa:#ff3fa4;    /* hot pink overprint */
  --noite:#120f38;   /* room background */
  --noite2:#1d1a52;  /* raised surfaces in the room */
  --giz:#ece9ff;     /* text on night */
  --giz2:#a29fd0;    /* secondary text on night */
  --ciano:#3fd0ff;
  --poster:"Big Shoulders Display",Impact,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 Archivo,system-ui,sans-serif;min-height:100dvh;background:var(--papel);color:var(--tinta)}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:6px;padding:11px 18px;transition:transform .1s,background-color .15s;white-space:nowrap}
button:active{transform:translateY(1px)}
:focus-visible{outline:3px solid var(--rosa);outline-offset:2px}
.hidden{display:none!important}

/* ---------- poster (home) ---------- */
#home{min-height:100dvh;display:grid;align-content:center;padding:clamp(20px,5vw,64px);position:relative;overflow:hidden;
  background:radial-gradient(circle,var(--rosa) 1.6px,transparent 2px) 0 0/11px 11px,var(--papel);
  background-blend-mode:normal}
#home::before{content:"";position:absolute;inset:0;background:var(--papel);
  clip-path:polygon(0 0,100% 0,100% 58%,0 82%)}
.poster{position:relative;width:min(980px,100%);margin:0 auto;display:grid;gap:clamp(18px,3vw,32px)}
.poster .kicker{font:900 clamp(22px,3.4vw,40px)/1 var(--poster);text-transform:uppercase;letter-spacing:.01em}
.poster h1{font:900 clamp(110px,26vw,300px)/.78 var(--poster);text-transform:uppercase;letter-spacing:-.01em;margin-left:-.04em;
  color:var(--tinta);text-shadow:.045em .045em 0 var(--rosa)}
.poster .crew{font:800 clamp(34px,7vw,84px)/.9 var(--poster);text-transform:uppercase;max-width:12ch}
.poster p{max-width:44ch;font-size:clamp(16px,1.6vw,18px);font-weight:500}
#enter{display:flex;gap:0;max-width:520px;background:var(--tinta);border-radius:8px;padding:5px;box-shadow:6px 6px 0 var(--rosa)}
#enter input{flex:1;min-width:0;font:inherit;font-weight:500;color:var(--giz);background:transparent;border:0;padding:12px 14px;outline:none}
#enter input::placeholder{color:var(--giz2)}
#enter button{background:var(--papel);color:var(--tinta)}
#enter button:hover{background:#fff}
@media (prefers-reduced-motion:no-preference){
  .poster h1{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes stamp{from{transform:scale(1.25) rotate(-2deg);opacity:0}}
}

/* ---------- room ---------- */
#room{position:fixed;inset:0;display:grid;grid-template-columns:1fr 272px;grid-template-rows:auto 1fr;background:var(--noite);color:var(--giz)}
#top{grid-column:1/-1;display:flex;gap:10px;align-items:center;padding:10px 14px;flex-wrap:wrap;background:var(--tinta)}
.logo{font:900 30px/1 var(--poster);text-transform:uppercase;color:var(--papel);text-shadow:2px 2px 0 var(--rosa);margin-right:6px}
.link{display:flex;gap:6px;align-items:center;flex:1;min-width:200px;background:var(--noite);border-radius:6px;padding:4px 4px 4px 12px}
.link span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--giz2);font-size:14px}
.link button{padding:7px 12px;font-size:14px;background:var(--noite2);color:var(--giz)}
.link button:hover{background:#2a2670}
.yes{background:var(--papel);color:var(--tinta)}
.yes:hover{background:#fff}
.no{background:var(--rosa);color:#fff}
.quiet{background:transparent;color:var(--giz);box-shadow:inset 0 0 0 2px var(--noite2)}
.quiet:hover{box-shadow:inset 0 0 0 2px var(--giz2)}
.quiet[aria-pressed=true]{background:var(--rosa);box-shadow:none;color:#fff}
.note{font-size:13px;color:var(--giz2);max-width:34ch;line-height:1.3}

#grid{display:grid;gap:10px;padding:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));grid-auto-rows:1fr;min-height:0}
.tile{position:relative;background:#000;border-radius:4px;overflow:hidden;cursor:zoom-in;min-height:0}
.tile video{width:100%;height:100%;object-fit:contain;display:block}
.tile .name{position:absolute;left:0;bottom:0;font:800 18px/1 var(--poster);text-transform:uppercase;background:var(--papel);color:var(--tinta);padding:6px 10px 5px}
.tile .ctl{position:absolute;right:8px;bottom:8px;display:flex;gap:8px;align-items:center;background:var(--tinta);border-radius:6px;padding:4px 10px 4px 4px;opacity:0;transition:opacity .15s;cursor:default}
.tile .ctl:not(.bare),.tile:hover .ctl,.tile:focus-within .ctl{opacity:1}
.tile .ctl.muted input{opacity:.45}
.tile .ctl .nosound{font-size:12px;color:var(--giz2);padding:0 4px 0 6px}
.tile .ctl input{width:96px}
.tile .ctl.bare{padding-right:4px}

/* theater: one screen big, the rest in a strip below, sidebar out of the way */
#theater[aria-pressed=true]{background:var(--papel);color:var(--tinta);box-shadow:none}
#room.theater{grid-template-columns:1fr;background:#000}
#room.theater #side,#room.theater .link,#room.theater .note{display:none}
#room.theater #top{background:transparent;padding:8px 10px;position:absolute;top:0;right:0;left:0;z-index:2;justify-content:flex-end;opacity:0;transition:opacity .2s}
#room.theater #top:hover,#room.theater #top:focus-within{opacity:1}
@media (hover:none){#room.theater #top{opacity:1;position:static}}
#room.theater #top .logo{margin-right:auto}
#room.theater #grid{grid-row:1/-1;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:8px;padding:0 0 8px}
#room.theater .tile{flex:0 0 200px;height:112px;border-radius:4px;cursor:pointer}
#room.theater .tile.focus{order:-1;flex-basis:100%;height:calc(100% - 128px);border-radius:0;cursor:default}
#room.theater.solo #grid{padding:0}
#room.theater.solo .tile.focus{height:100%}
#room.theater .tile:not(.focus){outline:2px solid transparent}
#room.theater .tile:not(.focus):hover{outline-color:var(--papel)}
#room.theater .tile:not(.focus) .name{font-size:14px;padding:4px 7px 3px}
#room.theater .tile:not(.focus) .ctl{display:none}
.ib{background:none;color:var(--giz);padding:5px 7px;border-radius:5px;font-size:15px;line-height:1}
.ib:hover{background:var(--noite2)}
.ib.muted{color:var(--rosa)}
input[type=range]{accent-color:var(--papel);min-width:0}
#empty{place-self:center;grid-column:1/-1;text-align:center;max-width:30ch}
#empty strong{display:block;font:900 clamp(40px,6vw,72px)/.9 var(--poster);text-transform:uppercase;color:var(--noite2);margin-bottom:10px}
#empty span{color:var(--giz2)}

#side{background:var(--noite);border-left:2px solid var(--noite2);overflow:auto;padding:16px 12px}
#side h2{font:900 26px/1 var(--poster);text-transform:uppercase;color:var(--papel);padding:0 6px}
#count{color:var(--giz2);font-size:13px;padding:4px 6px 12px}
.m{display:grid;grid-template-columns:34px 1fr auto;gap:6px 10px;align-items:center;padding:8px 6px;border-radius:6px}
.m:hover{background:var(--noite2)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:900 18px/1 var(--poster);color:var(--tinta)}
.m .who{min-width:0;display:flex;align-items:baseline;gap:6px}
.m .who b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .who small{color:var(--giz2);font-size:12px}
.rename{background:none;color:var(--giz2);font-size:12px;font-weight:500;padding:0 2px;text-decoration:underline;text-underline-offset:2px}
.rename:hover{color:var(--papel)}
.live{font-size:12px;font-weight:700;background:var(--rosa);color:#fff;padding:2px 8px;border-radius:99px}
.m .vol{grid-column:2/-1;display:flex;align-items:center;gap:6px}
.m .vol input{flex:1}
.m .vol span{font-size:12px;color:var(--giz2);width:36px;text-align:right;font-variant-numeric:tabular-nums}

.board{margin-top:18px;padding-top:16px;border-top:2px solid var(--noite2)}
.hint{color:var(--giz2);font-size:13px;padding:4px 6px 10px}
#memes{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px}
.meme{font-size:13px;font-weight:500;padding:6px 10px;background:var(--noite2);color:var(--giz);border-radius:6px;text-align:left;white-space:normal;line-height:1.2}
.meme:hover{background:var(--papel);color:var(--tinta)}
.meme.hit{background:var(--rosa);color:#fff}
.meme[disabled]{opacity:.5;cursor:default}
.memevol{display:flex;align-items:center;gap:6px;padding:12px 4px 0}
.memevol input{flex:1}
.memevol span{font-size:12px;color:var(--giz2);width:36px;text-align:right;font-variant-numeric:tabular-nums}
#toasts{position:fixed;left:14px;bottom:14px;display:flex;flex-direction:column-reverse;gap:6px;z-index:5;pointer-events:none}
.toast{background:var(--papel);color:var(--tinta);font-weight:700;padding:8px 12px;border-radius:6px;box-shadow:4px 4px 0 var(--rosa);max-width:70vw}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .25s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{from{transform:scale(.6);opacity:0}}}

@media (max-width:760px){
  #room{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  #side{border-left:0;border-top:2px solid var(--noite2);max-height:34dvh}
  .logo{font-size:24px}
}
</style>
</head>
<body>
<main id="home">
  <section class="poster">
    <div class="kicker" id="kicker">Hoje tem</div>
    <h1>Telão</h1>
    <div class="crew">da Tropa do Soca Fofo</div>
    <p id="lede">Cria a sala, joga o link no Discord e até quatro da tropa mostram a tela ao mesmo tempo. Com som, se quiser.</p>
    <form id="enter">
      <input type="text" id="nick" placeholder="Seu nome" maxlength="24" required autocomplete="nickname" aria-label="Seu nome">
      <button id="go">Criar sala</button>
    </form>
  </section>
</main>

<div id="room" class="hidden">
  <div id="top">
    <div class="logo">Telão</div>
    <div class="link"><span id="url"></span><button id="copy">Copiar link</button></div>
    <button id="share" class="yes">Mostrar minha tela</button>
    <button id="stop" class="no hidden">Parar de mostrar</button>
    <span id="note" class="note hidden"></span>
    <button id="deaf" class="quiet" aria-pressed="false">Mutar tudo</button>
    <button id="theater" class="quiet" aria-pressed="false" title="Atalho: T. Esc sai.">Modo teatro</button>
  </div>
  <div id="grid"><p id="empty"><strong>Telão apagado</strong><span>Ninguém está mostrando a tela. Clique em “Mostrar minha tela” para começar.</span></p></div>
  <aside id="side">
    <h2>Na sala</h2><div id="count"></div><div id="members"></div>
    <section class="board">
      <h2>Memes</h2>
      <p class="hint">Toca para a sala toda.</p>
      <div id="memes"></div>
      <div class="memevol"><button class="ib" id="hush" title="Parar os memes tocando agora">■</button><input type="range" id="memeVol" min="0" max="100" value="70" aria-label="Volume dos memes"><span id="memePct">70%</span></div>
    </section>
  </aside>
  <div id="toasts" aria-live="polite"></div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const ALPHA = "abcdefghjkmnpqrstuvwxyz23456789";
const PREFIX = "telao-", MAX = 4;
const rand = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => ALPHA[b % ALPHA.length]).join("");
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

// Audio preferences are local to this viewer, keyed by peer id.
const audio = { deaf: false, muted: new Map(), vol: new Map() };
const names = new Map();     // peerId -> nickname
let myName = "", render = () => {}, rename = () => {}, broadcast = () => {}, nameOf = id => id;

const code = location.hash.slice(1).toLowerCase();
$("nick").value = store.get("telao-nick") || "";
if (code) {
  $("kicker").textContent = "Chamaram você pro";
  $("lede").textContent = "Escolhe um nome para entrar. A tropa vê esse nome na lista da sala.";
  $("go").textContent = "Entrar na sala";
}
$("nick").focus();
$("enter").onsubmit = e => {
  e.preventDefault();
  myName = $("nick").value.trim().slice(0, 24) || "Anônimo";
  store.set("telao-nick", myName);
  $("go").disabled = true;
  start(code || rand(6));
};
// A returning member opening a room link goes straight in.
if (code && store.get("telao-nick")) { myName = store.get("telao-nick"); $("home").classList.add("hidden"); start(code); }

// Every member has a random peer id. The room itself is a second peer, `telao-<code>`,
// hosted by whichever member claimed it first: it hands newcomers the member list and
// caps simultaneous sharers. When its host leaves, the remaining members race to claim it.
function start(code) {
  const hubId = PREFIX + code;
  const peer = new Peer();
  const conns = new Map();     // peerId -> DataConnection (member mesh)
  const calls = new Map();     // peerId -> outgoing MediaConnection
  let stream = null, myId = null, hub = null, hubConn = null, claiming = false;

  peer.on("open", id => { myId = id; enterRoom(code); joinHub(); render(); });
  addEventListener("pagehide", () => { hub?.peer.destroy(); peer.destroy(); });
  window.telaoDebug = () => ({ me: myId, hosting: !!hub, claiming, hubOpen: !!hubConn?.open, members: [...conns.keys()], directory: hub && [...hub.conns.keys()] });
  peer.on("disconnected", () => peer.reconnect());
  peer.on("error", e => {
    if (e.type === "peer-unavailable") { if (String(e.message).includes(hubId)) claimHub(); return; }
    if (e.type !== "disconnected" && e.type !== "network") console.warn("peer", e.type, e);
  });
  peer.on("connection", c => wire(c));
  peer.on("call", call => {
    call.answer();
    call.on("stream", s => addTile(call.peer, s));
    call.on("close", () => dropTile(call.peer));
  });

  /* ---------- room directory ---------- */
  function claimHub() {
    if (hub || claiming) return;
    claiming = true;
    const h = new Peer(hubId);
    h.on("open", () => { claiming = false; hub = { peer: h, conns: new Map(), sharers: new Set() }; joinHub(); });
    h.on("disconnected", () => h.reconnect());
    h.on("error", e => { if (e.type === "unavailable-id") { claiming = false; h.destroy(); setTimeout(joinHub, 300); } });
    h.on("connection", c => {
      c.on("open", () => { watch(c); hub.conns.set(c.peer, c); c.send({ t: "peers", ids: [...hub.conns.keys()].filter(i => i !== c.peer) }); });
      c.on("data", m => {
        if (m.t === "sharing") hub.sharers.add(c.peer);
        else if (m.t === "stop") hub.sharers.delete(c.peer);
        else if (m.t === "want") {
          const ok = hub.sharers.size < MAX || hub.sharers.has(c.peer);
          if (ok) hub.sharers.add(c.peer);
          c.send({ t: ok ? "grant" : "deny" });
        }
      });
      c.on("close", () => { hub.conns.delete(c.peer); hub.sharers.delete(c.peer); });
    });
  }
  // Two people opening an empty room at once race for the directory; a connect to it can
  // also hang silently. Whatever went wrong, keep retrying until we are attached.
  setInterval(() => { if (myId && !claiming && !hubConn?.open) joinHub(); }, 3000);
  function joinHub() {
    const old = hubConn; hubConn = null; old?.close();
    const c = peer.connect(hubId, { reliable: true });
    hubConn = c;
    c.on("open", () => { watch(c); if (stream) c.send({ t: "sharing" }); });
    c.on("data", m => {
      if (m.t === "peers") m.ids.forEach(id => { if (id !== myId && !conns.has(id)) link(id); });
      else if (m.t === "grant") begin();
      else if (m.t === "deny") alert(`Já tem ${MAX} pessoas mostrando a tela. Espera alguém parar.`);
    });
    c.on("close", () => { if (hubConn !== c) return; hubConn = null; setTimeout(claimHub, 200 + Math.random() * 1500); });
  }

  /* ---------- member mesh ---------- */
  function link(id) { wire(peer.connect(id, { reliable: true })); }
  function wire(c) {
    c.on("open", () => {
      watch(c);
      conns.set(c.peer, c);
      c.send({ t: "hello", name: myName });
      if (stream) callPeer(c.peer);
      render();
    });
    c.on("data", m => {
      if (m.t === "hello") { names.set(c.peer, String(m.name).slice(0, 24)); render(); }
      else if (m.t === "stop") dropTile(c.peer);
      else if (m.t === "meme") playMeme(m.k, c.peer);
    });
    c.on("close", () => { conns.delete(c.peer); calls.delete(c.peer); names.delete(c.peer); dropTile(c.peer); });
  }
  function callPeer(id) {
    if (!stream) return;
    const call = peer.call(id, stream);
    calls.set(id, call);
    setTimeout(() => call.peerConnection?.getSenders().forEach(s => {
      if (s.track?.kind !== "video") return;
      const p = s.getParameters(); p.encodings = p.encodings?.length ? p.encodings : [{}];
      p.encodings[0].maxBitrate = 3_000_000; p.degradationPreference = "maintain-resolution";
      s.setParameters(p).catch(() => {});
    }), 500);
  }

  $("share").onclick = () => hubConn?.open ? hubConn.send({ t: "want" }) : alert("Ainda conectando na sala. Tenta de novo em um segundo.");
  async function begin() {
    try { stream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: { ideal: 30 } },
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, suppressLocalAudioPlayback: false },
      // System audio would carry the Discord call. Only a browser tab's own audio may go out.
      systemAudio: "exclude",
      selfBrowserSurface: "exclude",
    }); }
    catch { hubConn?.send({ t: "stop" }); return; }
    const t = stream.getVideoTracks()[0];
    const tabAudio = t.getSettings().displaySurface === "browser";
    if (!tabAudio) stream.getAudioTracks().forEach(a => { a.stop(); stream.removeTrack(a); });
    note(stream.getAudioTracks().length ? "Mandando a tela com o som desta aba."
      : tabAudio ? "Sem som: marque “Compartilhar áudio da guia” no seletor."
      : "Sem som: tela e janela vão mudas para o Discord não vazar. Para ter som, compartilhe uma aba.");
    t.contentHint = "detail"; t.onended = stop;
    $("share").classList.add("hidden"); $("stop").classList.remove("hidden");
    addTile("me", stream);
    conns.forEach((_, id) => callPeer(id));
  }
  function note(msg) { $("note").textContent = msg; $("note").classList.toggle("hidden", !msg); }
  $("stop").onclick = stop;
  function stop() {
    if (!stream) return;
    stream.getTracks().forEach(t => t.stop()); stream = null;
    calls.forEach(c => c.close()); calls.clear();
    conns.forEach(c => c.send({ t: "stop" }));
    hubConn?.send({ t: "stop" }); dropTile("me"); note("");
    $("stop").classList.add("hidden"); $("share").classList.remove("hidden");
  }

  rename = () => {
    const n = prompt("Seu nome na sala:", myName)?.trim().slice(0, 24);
    if (!n) return;
    myName = n; store.set("telao-nick", n);
    conns.forEach(c => c.send({ t: "hello", name: n }));
    render();
  };
  broadcast = msg => conns.forEach(c => c.open && c.send(msg));
  nameOf = id => id === "me" ? myName : names.get(id) || "alguém";
  render = () => {
    const people = [{ id: "me", name: myName, me: true }, ...[...conns.keys()].map(id => ({ id, name: names.get(id) || "conectando…" }))];
    const live = document.querySelectorAll(".tile").length;
    $("count").textContent = `${people.length} ${people.length === 1 ? "pessoa" : "pessoas"}, ${live} de ${MAX} telas ao vivo`;
    const box = $("members"); box.replaceChildren();
    for (const p of people) box.appendChild(member(p));
    document.querySelectorAll(".tile").forEach(t => {
      t.querySelector(".name").textContent = t.dataset.id === "me" ? `${myName} (você)` : names.get(t.dataset.id) || "conectando…";
    });
  };
}

function enterRoom(code) {
  const url = `${location.origin}${location.pathname}#${code}`;
  history.replaceState(null, "", "#" + code);
  $("home").classList.add("hidden"); $("room").classList.remove("hidden");
  $("url").textContent = url;
  $("copy").onclick = async () => { await navigator.clipboard.writeText(url); $("copy").textContent = "Copiado"; setTimeout(() => $("copy").textContent = "Copiar link", 1500); };
  $("deaf").onclick = () => {
    audio.deaf = !audio.deaf;
    $("deaf").setAttribute("aria-pressed", audio.deaf);
    $("deaf").textContent = audio.deaf ? "Desmutar tudo" : "Mutar tudo";
    applyAll(); render();
  };
}

// PeerJS rarely fires "close" when the other tab just vanishes; the ICE state does change.
function watch(c) {
  const pc = c.peerConnection; if (!pc) return;
  let timer;
  pc.addEventListener("connectionstatechange", () => {
    clearTimeout(timer);
    const st = pc.connectionState;
    if (st === "failed" || st === "closed") c.close();
    else if (st === "disconnected") timer = setTimeout(() => c.close(), 3000);
  });
}

/* ---------- audio ---------- */
const tileOf = id => document.querySelector(`.tile[data-id="${id}"]`);
const hasAudio = id => !!tileOf(id)?.querySelector("video").srcObject?.getAudioTracks().length;
// Every screen starts muted; the viewer turns on the ones they want to hear.
const isMuted = id => audio.deaf || audio.muted.get(id) !== false;
function apply(id) {
  const t = tileOf(id); if (!t) return;
  const v = t.querySelector("video");
  if (id === "me") { v.muted = true; return; }
  const muted = isMuted(id);
  v.muted = muted; v.volume = audio.vol.get(id) ?? 1;
  const ctl = t.querySelector(".ctl");
  ctl.classList.toggle("muted", muted);
  const mute = ctl.querySelector(".mute"); if (!mute) return;
  mute.textContent = muted ? "🔇" : "🔊";
  ctl.querySelector("input").value = Math.round(v.volume * 100);
}
function applyAll() { document.querySelectorAll(".tile").forEach(t => apply(t.dataset.id)); }
function toggleMute(id) {
  if (audio.deaf) { audio.deaf = false; $("deaf").setAttribute("aria-pressed", false); $("deaf").textContent = "Mutar tudo"; audio.muted.set(id, false); applyAll(); }
  else audio.muted.set(id, !isMuted(id));
  apply(id); render();
}
function setVol(id, pct) {
  audio.vol.set(id, pct / 100);
  if (pct > 0) audio.muted.set(id, false);
  apply(id);
  document.querySelectorAll(`[data-vol="${id}"]`).forEach(el => { if (el !== document.activeElement) el.value = pct; });
  document.querySelectorAll(`[data-pct="${id}"]`).forEach(el => el.textContent = pct + "%");
}

/* ---------- members ---------- */
const AVATARS = ["#ffe600", "#ff3fa4", "#3fd0ff", "#b6f24a", "#ff9b3f"];
function color(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AVATARS[h % AVATARS.length]; }
function member(p) {
  const el = document.createElement("div"); el.className = "m";
  const live = !!tileOf(p.id);
  const av = document.createElement("div"); av.className = "av"; av.style.background = color(p.name); av.textContent = (p.name[0] || "?").toUpperCase();
  const who = document.createElement("div"); who.className = "who";
  const b = document.createElement("b"); b.textContent = p.name; who.append(b);
  if (p.me) {
    const s = document.createElement("small"); s.textContent = "você"; who.append(s);
    const r = document.createElement("button"); r.className = "rename"; r.textContent = "trocar nome"; r.onclick = () => rename(); who.append(r);
  }
  el.append(av, who);
  const badge = document.createElement("span");
  if (live) { badge.className = "live"; badge.textContent = "ao vivo"; }
  el.append(badge);
  if (live && !p.me && hasAudio(p.id)) {
    const muted = isMuted(p.id);
    const vol = document.createElement("div"); vol.className = "vol";
    const btn = document.createElement("button"); btn.className = "ib" + (muted ? " muted" : ""); btn.textContent = muted ? "🔇" : "🔊";
    btn.title = muted ? "Ativar som" : "Mutar"; btn.onclick = () => toggleMute(p.id);
    const r = document.createElement("input"); r.type = "range"; r.min = 0; r.max = 100; r.dataset.vol = p.id;
    r.value = Math.round((audio.vol.get(p.id) ?? 1) * 100); r.oninput = () => setVol(p.id, +r.value);
    const pct = document.createElement("span"); pct.dataset.pct = p.id; pct.textContent = r.value + "%";
    vol.append(btn, r, pct); el.append(vol);
  }
  return el;
}

/* ---------- memes (myinstants) ---------- */
const MEMES = [
  ["faaah", "FAAAH"], ["voce-nao-tem-aura", "Você não tem aura"], ["auraa", "Auraa"],
  ["pou-estourado_zIWCpMy", "Pou estourado"], ["maldito-traidor", "Maldito traidor"], ["rela-no-jacare", "Rela no jacaré"],
  ["ilari-ilari-ilarie-troll", "Ilariê troll"], ["e-o-pix-nada-ainda", "E o pix? Nada ainda?"], ["rojao-super-estourado", "Rojão estourado"],
  ["dom-dom-tava-aqui-no-baile", "Tava aqui no baile"], ["escreve-e-apaga", "Escreve e apaga"], ["hee-hee-levanta-pobre", "Levanta, pobre"],
  ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-e-lutador", "AAAA é lutador"], ["hello-moto-estourado", "Hello Moto"], ["som-do-zap-zap-estourado", "Zap zap"],
  ["a-risada-do-kiko", "Risada do Kiko"], ["bom-dia-magnata", "Bom dia, magnata"], ["abriu-o-audio", "Abriu o áudio"],
  ["briga-de-gato", "Briga de gato"], ["dexter-meme", "Dexter"], ["psycho-scream-soundbible", "Grito"],
];
const memeUrl = k => `https://www.myinstants.com/media/sounds/${k}.mp3`;
const memeLabel = new Map(MEMES);
const playing = new Set(), lastFrom = new Map();
let memeVol = 0.7, cooldown = false;

for (const [k, label] of MEMES) {
  const b = document.createElement("button"); b.className = "meme"; b.textContent = label; b.dataset.k = k;
  b.onclick = () => {
    if (cooldown) return;
    cooldown = true; document.querySelectorAll(".meme").forEach(x => x.disabled = true);
    setTimeout(() => { cooldown = false; document.querySelectorAll(".meme").forEach(x => x.disabled = false); }, 1500);
    broadcast({ t: "meme", k });
    playMeme(k, "me");
  };
  $("memes").appendChild(b);
}
$("memeVol").oninput = e => { memeVol = e.target.value / 100; $("memePct").textContent = e.target.value + "%"; playing.forEach(a => a.volume = memeVol); };
$("hush").onclick = () => { playing.forEach(a => a.pause()); playing.clear(); };

function playMeme(k, from) {
  if (!memeLabel.has(k)) return;                       // only our own list, never a URL from the wire
  const now = Date.now();
  if (from !== "me" && now - (lastFrom.get(from) || 0) < 1000) return;
  lastFrom.set(from, now);
  const btn = document.querySelector(`.meme[data-k="${k}"]`);
  btn?.classList.add("hit"); setTimeout(() => btn?.classList.remove("hit"), 600);
  if (!audio.deaf && memeVol > 0) {
    const a = new Audio(memeUrl(k)); a.volume = memeVol;
    playing.add(a); a.onended = () => playing.delete(a);
    a.play().catch(() => { playing.delete(a); toast(`Clique em qualquer lugar para ouvir os memes.`); });
  }
  toast(`${from === "me" ? "Você" : nameOf(from)}: ${memeLabel.get(k)}`);
}
function toast(text) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = text;
  $("toasts").appendChild(t);
  while ($("toasts").children.length > 4) $("toasts").firstChild.remove();
  setTimeout(() => t.remove(), 3000);
}

/* ---------- theater ---------- */
const view = { theater: false, focus: null };
function theater(on, id) {
  view.theater = on;
  if (id) view.focus = id;
  $("room").classList.toggle("theater", on);
  $("theater").setAttribute("aria-pressed", on);
  $("theater").textContent = on ? "Sair do teatro" : "Modo teatro";
  layout();
}
function layout() {
  const tiles = [...document.querySelectorAll(".tile")];
  if (!tileOf(view.focus)) view.focus = tiles.find(t => t.dataset.id !== "me")?.dataset.id || tiles[0]?.dataset.id || null;
  tiles.forEach(t => t.classList.toggle("focus", view.theater && t.dataset.id === view.focus));
  $("room").classList.toggle("solo", tiles.length <= 1);
}
function fullscreen(t) { document.fullscreenElement ? document.exitFullscreen() : t.requestFullscreen(); }
$("theater").onclick = () => theater(!view.theater);
addEventListener("keydown", e => {
  if (e.target.matches?.("input[type=text], input[type=range]") || $("room").classList.contains("hidden")) return;
  if (e.key === "Escape" && view.theater && !document.fullscreenElement) theater(false);
  else if (e.key.toLowerCase() === "t" && !e.metaKey && !e.ctrlKey) theater(!view.theater);
});

/* ---------- tiles ---------- */
function addTile(id, stream) {
  let t = tileOf(id);
  if (!t) {
    t = document.createElement("div"); t.className = "tile"; t.dataset.id = id;
    t.innerHTML = `<video autoplay playsinline muted></video><span class="name"></span>`;
    t.onclick = () => { if (!t.classList.contains("focus")) theater(true, id); };
    t.ondblclick = () => fullscreen(t);
    $("grid").appendChild(t);
  }
  const v = t.querySelector("video"); v.srcObject = stream;
  t.querySelector(".ctl")?.remove();
  const ctl = document.createElement("div"); ctl.className = "ctl";
  ctl.onclick = e => e.stopPropagation();
  ctl.ondblclick = e => e.stopPropagation();
  if (id !== "me" && stream.getAudioTracks().length) {
    ctl.innerHTML = `<button class="ib mute"></button><input type="range" min="0" max="100" data-vol="${id}" aria-label="Volume">`;
    ctl.querySelector(".mute").onclick = () => toggleMute(id);
    ctl.querySelector("input").oninput = e => setVol(id, +e.target.value);
  } else {
    ctl.classList.add("bare");
    if (id !== "me") ctl.innerHTML = `<span class="nosound">sem som</span>`;
  }
  const fs = document.createElement("button"); fs.className = "ib"; fs.textContent = "⛶"; fs.title = "Tela cheia (duplo clique)";
  fs.onclick = () => fullscreen(t);
  ctl.appendChild(fs); t.appendChild(ctl);
  layout();
  apply(id);
  v.play().catch(() => { audio.muted.set(id, true); apply(id); render(); v.play().catch(() => {}); });
  $("empty").classList.add("hidden");
  render();
}
function dropTile(id) {
  tileOf(id)?.remove();
  layout();
  if (!document.querySelector(".tile")) $("empty").classList.remove("hidden");
  render();
}
</script>
